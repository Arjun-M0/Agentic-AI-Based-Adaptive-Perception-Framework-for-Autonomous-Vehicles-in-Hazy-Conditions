project:
  name: 'Agentic Adaptive Perception Framework'
  version: '0.1.0'

pipeline:
  strategies: ['Bypass', 'DEA-Net', 'DehazeFormer']
  detection_model: 'YOLOv11'

evaluation:
  metrics: ['mAP', 'Precision', 'Recall', 'FPS', 'Latency']

decision:
  strategies: ['Bypass', 'DEA-Net', 'DehazeFormer']
  weights:
    environment: 0.4
    resource: 0.3
    historical: 0.3
    performance: 0.0 # Will be used when metrics are available
  retrieval:
    top_k: 5
  requirements:
    target_fps: 30.0
    max_latency_ms: 100.0
